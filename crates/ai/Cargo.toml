[package]
name = "nephclick-photolab-ai"
description = "The AI service Nephclick PhotoLab calls: OpenAI-compatible text and image requests (OpenRouter by default), the stored API key, and the prompts and parsers for palettes, ideas and AI Fill"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.23"

# Network calls are native only: the browser build reports that AI is unavailable there.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-ai = { workspace = true }
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
