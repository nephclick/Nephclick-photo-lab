[package]
name = "nephclick-photolab-paint"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
nephclick-photolab-geom = { workspace = true }
nephclick-photolab-color = { workspace = true }
nephclick-photolab-raster = { workspace = true }
serde = { workspace = true }
rustc-hash = { workspace = true }
# The tile serde form and commands that take file bytes as base64 text.
base64 = "0.23"

# Large tips rasterize, accumulate and composite in parallel (the same pixels as serially).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }

[dev-dependencies]
craft-cms = { workspace = true }
serde_json = { workspace = true }
